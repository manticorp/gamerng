version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-tools:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /tools/babel
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      babel-compiler:
        patterns: ['@babel/*']
